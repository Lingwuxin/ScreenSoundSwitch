name: Release

# Build the MSIX packages for a published GitHub release and attach them to it.
# The app is MSIX-only: it calls ApplicationData.Current, so it needs package identity.
# Packages are signed with the certificate in MSIX_CERT_PFX_BASE64/MSIX_CERT_PASSWORD;
# without those secrets the build still succeeds but produces unsigned packages.

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  msix:
    name: MSIX (${{ matrix.platform }})
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # A base64 PKCS#12 holding a code-signing certificate whose subject matches the
      # manifest Publisher (CN=16124), plus its password. When they are missing the
      # packages stay unsigned, which Windows refuses to install.
      MSIX_CERT_PFX_BASE64: ${{ secrets.MSIX_CERT_PFX_BASE64 }}
      MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
          - platform: ARM64

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # WinUI 3 packaging needs the Visual Studio MSBuild and its MSIX tooling.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: msbuild ScreenSoundSwitch.sln -t:restore -p:Configuration=Release -p:Platform=${{ matrix.platform }}

      # An MSIX takes its version from Package.appxmanifest, so derive it from the release tag
      # (v1.2.3 -> 1.2.3.0). A tag without a usable version keeps the manifest's own version.
      - name: Set the package version from the release tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $core = (($tag -replace '^[vV]', '') -split '-')[0]
          $numbers = foreach ($part in ($core -split '\.')) {
            $digits = $part -replace '[^0-9]', ''
            $value = 0
            if ($digits -and [int]::TryParse($digits, [ref]$value)) {
              [Math]::Min([Math]::Max($value, 0), 65535)
            } else { 0 }
          }
          $numbers = @($numbers)
          while ($numbers.Count -lt 4) { $numbers += 0 }
          $numbers = $numbers[0..3]
          if (($numbers | Measure-Object -Sum).Sum -eq 0) {
            Write-Host "Tag '$tag' carries no usable version; keeping the manifest version."
            exit 0
          }
          $version = $numbers -join '.'

          $path = "ScreenSoundSwitch.WinUI/Package.appxmanifest"
          [xml]$manifest = Get-Content -Path $path -Raw
          $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $ns.AddNamespace('appx', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $identity = $manifest.SelectSingleNode('//appx:Identity', $ns)
          if (-not $identity) { throw "No Identity element found in $path" }
          $identity.SetAttribute('Version', $version)
          $manifest.Save((Resolve-Path $path).Path)
          Write-Host "Package version set to $version (from tag '$tag')"

      - name: Build MSIX
        run: >
          msbuild ScreenSoundSwitch.WinUI/ScreenSoundSwitch.WinUI.csproj
          -t:publish
          -p:Configuration=Release
          -p:Platform=${{ matrix.platform }}
          -p:UapAppxPackageBuildMode=SideloadOnly
          -p:AppxBundle=Never
          -p:AppxPackageSigningEnabled=false
          -p:GenerateAppxPackageOnBuild=true

      - name: Collect the package
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path ScreenSoundSwitch.WinUI -Recurse -Filter *.msix -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $msix) {
            Write-Host "Packaging output that was produced:"
            Get-ChildItem -Path ScreenSoundSwitch.WinUI -Recurse -Include *.msix, *.appx, *.msixupload, *.appxupload -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "No .msix package was produced"
          }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $target = "out/ScreenSoundSwitch-${{ github.event.release.tag_name }}-${{ matrix.platform }}.msix"
          Copy-Item $msix.FullName $target
          "Artifact: $target ($([math]::Round($msix.Length / 1MB, 2)) MB)"

      - name: Sign the package
        if: env.MSIX_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'msix-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_CERT_PFX_BASE64))

          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found in the Windows SDK' }

          $msix = Get-ChildItem -Path out -Filter *.msix | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:MSIX_CERT_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 $msix.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($msix.FullName)
          $signed = [bool]($zip.Entries | Where-Object { $_.FullName -like 'AppxSignature*' })
          $zip.Dispose()
          if (-not $signed) { throw 'The package does not carry AppxSignature.p7x after signing' }

          # Publish the public certificate so users can trust the publisher first.
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:MSIX_CERT_PASSWORD)
          [IO.File]::WriteAllBytes(
              "out/ScreenSoundSwitch-${{ github.event.release.tag_name }}.cer",
              $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          Remove-Item $pfx
          Write-Host "Signed $($msix.Name) and exported the public certificate."

      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "out/*.msix" --clobber

      # The same certificate is exported by both matrix jobs; attach it once.
      - name: Attach the signing certificate
        if: env.MSIX_CERT_PFX_BASE64 != '' && matrix.platform == 'x64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "out/*.cer" --clobber
