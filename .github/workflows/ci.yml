name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (WinUI / .NET 8)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # WinUI 3 needs the MSBuild that ships with Visual Studio: the Windows App
      # SDK PRI targets load Microsoft.Build.Packaging.Pri.Tasks.dll from the VS
      # MSBuild extensions directory, which the .NET SDK alone does not provide.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Toolchain info
        shell: pwsh
        run: |
          Write-Host "dotnet:  $(dotnet --version)"
          Write-Host "msbuild: $((Get-Command msbuild).Source)"
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\MSBuild\Microsoft\VisualStudio\*\AppxPackage\Microsoft.Build.Packaging.Pri.Tasks.dll" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

      - name: Restore
        run: msbuild ScreenSoundSwitch.sln -t:restore -p:Configuration=Release -p:Platform=x64

      - name: Build
        run: msbuild ScreenSoundSwitch.sln -t:build -p:Configuration=Release -p:Platform=x64
